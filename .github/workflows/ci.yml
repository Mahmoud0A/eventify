name: CI

on:
  push:
    branches: [main, 'session-*']
  pull_request:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eventify
          POSTGRES_PASSWORD: eventify
          POSTGRES_DB: eventify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://eventify:eventify@localhost:5432/eventify
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eventify:eventify@localhost:5432/eventify
      - run: npm test
        env:
          DATABASE_URL: postgresql://eventify:eventify@localhost:5432/eventify
